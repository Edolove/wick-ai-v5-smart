<!doctype html><html lang='fr'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Wick AI Analyzer V5.2</title><meta name='theme-color' content='#07101f'><style>body{margin:0;background:#07101f;color:#eef2ff;font-family:Arial}.w{max-width:820px;margin:auto;padding:14px}.c{background:#111d33;border:1px solid #263957;border-radius:18px;padding:14px;margin:10px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.m{background:#18253d;border-radius:12px;padding:12px}.big{text-align:center;padding:22px;border-radius:18px;background:#493707;font-size:34px;font-weight:700}.call{background:#063d2a}.put{background:#4a1519}button,select{width:100%;padding:12px;border-radius:12px;border:1px solid #31496e;background:#172844;color:#fff}.small{font-size:12px;color:#a8b8cf}</style></head><body><div class='w'><div class='c'><h2>Wick AI Analyzer — V5.2</h2><div class='small'>S1 Zone Testée • Décision verrouillée T-7s</div><div class='g'><select id=s><option>BTCUSDT</option><option>ETHUSDT</option><option>SOLUSDT</option><option>BNBUSDT</option><option>XRPUSDT</option></select><select id=tf><option value='1m'>1 minute</option><option value='3m'>3 minutes</option></select></div><div class='g' style='margin-top:10px'><button onclick='start()'>DÉMARRER</button><button onclick='stop()'>ARRÊTER</button></div></div><div id=signal class='big'>ANALYSE…</div><div class='g'><div class='m'>Prix<div id=price>—</div></div><div class='m'>Temps<div id=time>—</div></div><div class='m'>Zone<div id=zone>Recherche</div></div><div class='m'>Confiance<div id=conf>—</div></div></div><div class='c'><h3>Radar Live</h3><div class='g'><div class='m'>EMA<div id=ema>—</div></div><div class='m'>Momentum<div id=momentum>—</div></div><div class='m'>Structure<div id=structure>—</div></div><div class='m'>Range<div id=range>—</div></div></div></div><div class='c'><h3>Journal</h3><pre id=log style='white-space:pre-wrap;max-height:180px;overflow:auto'></pre></div><script>let ws,bars=[],lock=null,current=null;const $=i=>document.getElementById(i);const log=t=>$('log').textContent='['+new Date().toLocaleTimeString()+'] '+t+'\n'+$('log').textContent;function ema(a,n){if(a.length<n)return null;let e=a.slice(0,n).reduce((x,y)=>x+y,0)/n,k=2/(n+1);for(let i=n;i<a.length;i++)e=a[i]*k+e*(1-k);return e;}async function start(){stop();lock=null;current=null;bars=[];const s=$('s').value,tf=$('tf').value;const r=await fetch('https://api.binance.com/api/v3/klines?symbol='+s+'&interval='+tf+'&limit=100');const d=await r.json();bars=d.map(k=>({t:+k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4],T:+k[6]}));log('100 bougies chargées');ws=new WebSocket('wss://stream.binance.com:9443/ws/'+s.toLowerCase()+'@kline_'+tf);ws.onmessage=e=>{const k=JSON.parse(e.data).k,x={t:+k.t,o:+k.o,h:+k.h,l:+k.l,c:+k.c,T:+k.T};if(bars.at(-1)?.t===x.t)bars[bars.length-1]=x;else bars.push(x);if(bars.length>300)bars.shift();update();};}function stop(){if(ws)ws.close();}function update(){const z=bars.at(-1);if(!z)return;const a=bars.map(x=>x.c),e5=ema(a,5),e9=ema(a,9),e21=ema(a,21);const recent=bars.slice(-5);const greens=recent.filter(c=>c.c>c.o).length,reds=recent.filter(c=>c.c<c.o).length;const hi=Math.max(...recent.map(c=>c.h)),lo=Math.min(...recent.map(c=>c.l));const avgRange=recent.reduce((s,c)=>s+(c.h-c.l),0)/5;const avgBody=recent.reduce((s,c)=>s+Math.abs(c.c-c.o),0)/5;const isRange=avgBody<avgRange*0.42;const rejLow=(z.o-z.l)>(z.h-z.l)*0.55&&z.c>z.o&&z.l<=lo*1.0002;const rejHigh=(z.h-z.c)>(z.h-z.l)*0.55&&z.c<z.o&&z.h>=hi*0.9998;let cand='ATTENDRE',conf=52;if(rejLow){cand='CALL';conf=84;}else if(rejHigh){cand='PUT';conf=84;}else if(!isRange&&e5&&e9&&e21){if(e5>e9&&e9>e21&&greens>=3){cand='CALL';conf=72;}if(e5<e9&&e9<e21&&reds>=3){cand='PUT';conf=72;}}if(isRange)conf=Math.min(conf,55);const sec=Math.max(0,(z.T-Date.now())/1000);if(current!==z.t){current=z.t;lock=null;}if(sec<=7&&sec>0&&!lock){lock={d:cand,c:conf};log('🔒 '+cand+' verrouillé à T-7s');}const show=lock?lock.d:'ANALYSE…';$('signal').textContent=show;$('signal').className='big '+(show=='CALL'?'call':show=='PUT'?'put':'');$('price').textContent=z.c.toFixed(2);$('time').textContent=sec.toFixed(1)+' s';$('zone').textContent=rejLow?'Demande validée':rejHigh?'Résistance validée':isRange?'Range':'Recherche';$('conf').textContent=(lock?lock.c:conf)+'%';$('ema').textContent=e5&&e9&&e21?(e5>e9?'Haussière':'Baissière'):'—';$('momentum').textContent=cand;$('structure').textContent=greens>=3?'HH':reds>=3?'LL':'Mixte';$('range').textContent=isRange?'Oui':'Non';}</script></body></html>
