<!doctype html><html lang='fr'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='theme-color' content='#07101f'><title>Wick AI Analyzer V5.3</title></head><body style='margin:0;background:#07101f;color:#eef2ff;font-family:Arial'><div style='max-width:860px;margin:auto;padding:16px'><h2>Wick AI Analyzer V5.3</h2><p>Observation → Validation → Verrouillage à T-7 s</p><button onclick='start()'>DÉMARRER</button><button onclick='stop()'>ARRÊTER</button><h1 id=sig>OBSERVATION</h1><div>Prix: <span id=price>—</span></div><div>Temps: <span id=time>—</span></div><pre id=log></pre></div><script>let ws,b=[],lock=null,last=null;const g=i=>document.getElementById(i),L=t=>g('log').textContent='['+new Date().toLocaleTimeString()+'] '+t+'\n'+g('log').textContent;async function start(){stop();b=[];lock=null;let s='BTCUSDT';let r=await fetch('https://api.binance.com/api/v3/klines?symbol='+s+'&interval=1m&limit=100');let d=await r.json();b=d.map(k=>({t:+k[0],c:+k[4],T:+k[6]}));ws=new WebSocket('wss://stream.binance.com:9443/ws/'+s.toLowerCase()+'@kline_1m');ws.onmessage=e=>{let k=JSON.parse(e.data).k,x={t:+k.t,c:+k.c,T:+k.T};if(b.at(-1)?.t===x.t)b[b.length-1]=x;else b.push(x);let sec=Math.max(0,(x.T-Date.now())/1000);g('price').textContent=x.c.toFixed(2);g('time').textContent=sec.toFixed(1)+' s';if(last!==x.t){last=x.t;lock=null;g('sig').textContent='OBSERVATION';}if(sec<=7&&!lock){lock='ATTENDRE';g('sig').textContent=lock;L('Signal verrouillé : '+lock);}}}function stop(){if(ws)ws.close();}</script></body></html>
